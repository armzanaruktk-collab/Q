name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  HEV_REPO: https://github.com/heiher/hev-socks5-tunnel

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check Android source exists
        run: |
          if [ ! -f app/build.gradle.kts ] || [ ! -f settings.gradle.kts ]; then
            echo "::error::Android source is missing. Upload the contents of SshVpn/ from SshVpn-review-fixed.zip to the repository root, then push again."
            exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build hev-socks5-tunnel native libraries
        run: |
          mkdir -p hev
          git clone --recursive --depth 1 --shallow-submodules "$HEV_REPO" hev/jni
          cd hev
          "$ANDROID_NDK_HOME/ndk-build" NDK_PROJECT_PATH=. APP_BUILD_SCRIPT=jni/Android.mk NDK_APPLICATION_MK=jni/Application.mk -j"$(nproc)"
          for abi in arm64-v8a armeabi-v7a x86_64; do
            mkdir -p ../app/src/main/jniLibs/$abi
            cp libs/$abi/libhev-socks5-tunnel.so ../app/src/main/jniLibs/$abi/
          done

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: ssh-tunnel-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
